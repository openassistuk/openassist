packages:
  - apps/*
  - packages/*

engineStrict: true

allowBuilds:
  '@whiskeysockets/baileys': true
  esbuild: true
  protobufjs: true
  sharp: true

# Narrow patched floors for transitive packages that upstream ranges still allow.
overrides:
  # Our WASM library adapter uses node:fs globbing, not the upstream CLI globber.
  # Remove its unused braces dependency path (GHSA-vfj7-8cjw-p6xm; no patch).
  '@tktco/node-actionlint@1.6.0>fast-glob': '-'
  'source-map-js@>=1.0.0 <1.2.2': '1.2.2'
  'undici@>=6.0.0 <6.28.1': '6.28.1'
  'protobufjs@<7.6.5': '7.6.5'
  'sharp@<0.35.4': '0.35.4'
  'axios@<1.20.0': '1.20.0'
  'ws@>=8.0.0 <8.21.0': '8.21.0'
  'lodash@<4.18.1': '4.18.1'
  'picomatch@<2.3.2': '2.3.2'
  '@whiskeysockets/baileys>libsignal': '6.0.0'
  'form-data@>=4.0.0 <4.0.6': '4.0.6'
  'brace-expansion@>=3.0.0 <5.0.12': '5.0.12'
