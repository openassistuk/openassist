packages:
  - apps/*
  - packages/*

engineStrict: true

allowBuilds:
  '@whiskeysockets/baileys': true
  esbuild: true
  protobufjs: true
  sharp: true

# Narrow patched floors for transitive packages that upstream ranges still allow.
overrides:
  # Our WASM library adapter uses node:fs globbing, not the upstream CLI globber.
  # Remove its unused braces dependency path (GHSA-vfj7-8cjw-p6xm; no patch).
  '@tktco/node-actionlint@1.6.0>fast-glob': '-'
  'source-map-js@>=1.0.0 <1.2.2': '1.2.2'
  'undici@>=6.0.0 <6.29.1': '6.29.1'
  'follow-redirects@>=1.16.0 <1.16.2': '1.16.2'
  'vite@>=8.3.0 <8.3.3': '8.3.3'
  # test-exclude 8 uses the same CommonJS glob.sync/minimatch APIs on Node 24.
  'test-exclude@8.0.0>glob': '14.0.2'
  'test-exclude@8.0.0>minimatch': '11.0.1'
  'protobufjs@<7.6.5': '7.6.5'
  'sharp@<0.35.5': '0.35.5'
  'music-metadata@>=11.0.0 <11.16.0': '11.16.0'
  'axios@<1.20.0': '1.20.0'
  'ws@>=8.0.0 <8.21.0': '8.21.0'
  'lodash@<4.18.1': '4.18.1'
  'picomatch@<2.3.2': '2.3.2'
  '@whiskeysockets/baileys>libsignal': '6.0.0'
  'form-data@>=4.0.0 <4.0.6': '4.0.6'
  'brace-expansion@>=3.0.0 <5.0.12': '5.0.12'

minimumReleaseAgeExclude:
  - '@anthropic-ai/sdk@0.135.0'

patchedDependencies:
  '@whiskeysockets/baileys@6.7.24': patches/@whiskeysockets__baileys@6.7.24.patch

# This exact peer version is supported by the tested waveform compatibility patch.
peerDependencyRules:
  allowedVersions:
    '@whiskeysockets/baileys@6.7.24>audio-decode': '4.2.0'
